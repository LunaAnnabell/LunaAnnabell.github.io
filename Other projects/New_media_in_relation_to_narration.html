    <div class="container" style="max-width: 800px;">
        <!-- Back to front page button -->
        <p style="margin-bottom: 2rem;"><a href="../index.html" class="btn">← Back to front page</a></p>

        <main class="markdown-content" data-markdown="New_media_in_relation_to_narration.md">
            <p>Loading project content...</p>
        </main>

        <!-- AUTOMATIC SKILLS SECTION -->
        <section style="margin-bottom: 3rem;">
            <h2>Skills Applied in this Project</h2>
            <div id="project-skills" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
        </section>

        <script>
            const currentProjectName = "New media in relation to narration"; 

            fetch('../skills.json') 
                .then(response => response.json())
                .then(skills => {
                    const container = document.getElementById('project-skills');
                    const filteredSkills = skills.filter(s => s.project === currentProjectName);
                    filteredSkills.forEach(skill => {
                        const span = document.createElement('span');
                        span.className = 'tag';
                        span.textContent = skill.name;
                        container.appendChild(span);
                    });
                })
                .catch(error => console.error('Error loading skills for project:', error));
        </script>

        <!-- CONTACT SECTION -->
        <section id="contact" style="margin-bottom: 3rem;">
            <h2>Contact</h2>
            <div class="contact-card">
                <div class="contact-item">

                    <span><a href="https://www.linkedin.com/in/luna-annabell-linn%C3%A9-jensen" target="_blank">LinkedIn Profile</a></span>
                </div>
                <div class="contact-item">
                    <strong>GitHub</strong>
                    <span><a href="https://github.com/LunaAnnabell" target="_blank">GitHub Profile</a></span>
                </div>
                <div class="contact-item">
                    <strong>Email</strong>
                    <span><a href="mailto:Lunaannabell@outlook.dk">lunaannabell@outlook.dk</a></span>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
