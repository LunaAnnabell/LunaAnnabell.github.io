<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Portfolio</title>
    <!-- Connect to your main stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Extra styles to center the card vertically in the middle of the screen */
        .center-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            padding: 1rem;
        }
        
        .coming-soon-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }

        .coming-soon-card svg {
            color: var(--accent);
            width: 50px;
            height: 50px;
            margin: 0 auto 1.5rem auto;
        }

        .coming-soon-card h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .coming-soon-card p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="center-wrapper">
        <div class="coming-soon-card">
            <!-- Icon -->
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
            </svg>
            
            <h1>Coming Soon</h1>
            <p>I am currently curating the details and visuals for this project. Check back a little later to see the full case study.</p>
            
            <!-- Using your custom button classes from style.css -->
            <a href="index.html" class="btn btn-accent">Return to Portfolio</a>
        </div>
    </div>

</body>
</html>
